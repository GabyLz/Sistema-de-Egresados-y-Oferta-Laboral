
name: CI

on:
	push:
		branches: [ main ]
	pull_request:
		branches: [ main ]

jobs:
	test-and-build:
		runs-on: ubuntu-latest
		services:
			postgres:
				image: postgres:15
				env:
					POSTGRES_DB: egresados
					POSTGRES_USER: postgres
					POSTGRES_PASSWORD: postgres
				ports:
					- 5432:5432
				options: >-
					--health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
		steps:
			- uses: actions/checkout@v4

			- name: Use Node.js
				uses: actions/setup-node@v4
				with:
					node-version: 20

			- name: Install dependencies (mono)
				run: |
					cd proyecto/apps/web || true
					# install commands per package manager

